[platformio]
boards_dir = boards

[env:T5-ePaper-S3]
platform = espressif32
board = T5-ePaper-S3
framework = arduino
board_build.extra_flags =
	-DBOARD_HAS_PSRAM
upload_speed = 921600
upload_port = /dev/ttyACM1
monitor_speed = 115200
monitor_port = /dev/ttyACM1
monitor_dtr = 1
monitor_rts = 0
lib_deps =
	https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git#esp32s3
build_flags =
	-Iinclude
	-Isrc
	-O3
	-DLILYGO_T5_EPD47_S3
	-DARDUINO_USB_CDC_ON_BOOT=1
